# 构建 Docker 镜像并发布到 ghcr（路线图第 3 项）。用法见 docs/deploy.md「用发布的镜像」。
# - 推送 v* 标签：发布 <版本号>（去掉 v）；不是预发布版（版本号里没有 -）时同时发布 latest。
# - 合并到 main：发布 main 和 sha-<短提交号>。
# - PR 改到镜像的输入时：只构建，不登录、不推送。
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - package.json
      - package-lock.json
      - vendor/**
      - .github/workflows/image.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/izelzzz/eos-workbench

jobs:
  build:
    name: image-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t eos-image-check .
      # 镜像能启动、平台的启动包装能降到 eos 用户（Docker 默认带 SETUID、SETGID、KILL）。
      - run: docker run --rm eos-image-check eos --help

  publish:
    name: image-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: 算出标签
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/image-tags.ts "$IMAGE" "$REF_TYPE" "$REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: 构建
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker build --pull "${args[@]}" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            .
      - name: 镜像能启动
        env:
          FIRST: ${{ steps.tags.outputs.first }}
        run: docker run --rm "$FIRST" eos --help
      - name: 登录 ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: 推送
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: for t in $TAGS; do docker push "$t"; done
