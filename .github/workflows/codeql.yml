# CodeQL 代码扫描（JavaScript/TypeScript）。仓库是公开的，代码扫描免费。
# 结果在仓库的 Security → Code scanning 页。
# 拦告警的是 GitHub 自动生成的「CodeQL」检查（或规则集里的 Code scanning results 规则）：有新告警时它变红。
# 下面的 codeql-analyze job 只证明扫描跑完并上传了结果，有告警时它照样通过。
# 设必需检查时两个都勾；改 job 名前先改分支保护。见 docs/roadmap.md 的 CI 一项。
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # 每周一次扫 main：查询规则会更新，没改代码也可能查出新问题
  schedule:
    - cron: '23 4 * * 1'

# 默认只读；上传结果需要的 security-events: write 只给下面这一个 job。这个工作流不使用任何仓库密钥。
permissions:
  contents: read

concurrency:
  # 带上事件名：main 上同一个提交的 push 运行和每周的定时运行不互相取消
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # 和 ci.yml、image.yml、Dockerfile 的 Node 版本一致
  NODE_VERSION: 24.22.3

jobs:
  # 纯文档 PR 跳过下面重的检查（判断见 .github/scripts/docs-only.ts）。脚本从 base（HEAD^1）取，PR 改它改变不了自己的结果。
  # 不是 pull_request、PR 不是指向默认分支（main）、base 上还没有这个脚本、或者这个 job 出错时，docs_only 都不是 true，下面照跑全套。
  # 只认指向 main 的 PR：不然先指向一个带了代码改动的分支（相对它只改文档）跳过检查，再把 base 改成 main，检查结果不会重跑。
  # 重的 job 跳过时，按原来的名字报告为 skipped（分支保护里算通过），不会卡在等待中。
  changes:
    name: changes-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: check
        if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        run: |
          if git show HEAD^1:.github/scripts/docs-only.ts > "$RUNNER_TEMP/docs-only.ts" 2>/dev/null; then
            node "$RUNNER_TEMP/docs-only.ts"
          else
            echo "base 上还没有 .github/scripts/docs-only.ts，跑全套"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  codeql-analyze:
    name: codeql-analyze
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # CodeQL 官方模板里有；仓库是私有时读工作流运行信息要用
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # 解释型语言，不需要构建
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
