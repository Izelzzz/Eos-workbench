# 用 gitleaks 扫描密钥泄露。见 docs/roadmap.md 的 CI 一项。
# job 名字（gitleaks）会设成必需检查，改名前先改分支保护。
name: Secrets

on:
  pull_request:
  push:
    branches: [main]

# 默认只读。这个工作流不使用任何仓库密钥。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # 官方发布的 gitleaks_8.30.1_checksums.txt 里 linux_x64 那一行
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 取全部历史：每次都扫检出的合并提交（HEAD）的完整历史，即这个 PR 的提交和 main 的全部提交，
      # 包括 docs/e2e/ 下的证据文件。只扫 HEAD，不扫远程的其他分支（见下面的 --log-opts）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # 不用 gitleaks-action：它需要令牌。直接下载固定版本并校验 sha256
      - name: 安装 gitleaks
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
      # --redact：日志里只出现规则、文件、行号、提交和指纹，不出现密钥本身。
      # 自检：用仓库的配置（.gitleaks.toml，含默认规则）扫一个运行时生成的假令牌，必须报出来。
      # 证明允许清单没有把默认规则放空。假令牌不进仓库，值和允许清单里的不同
      - name: 自检：默认规则在生效
        run: |
          d="$RUNNER_TEMP/selfcheck"; mkdir -p "$d"
          printf 'token = "ghp_%s%s"\n' CIselfcheckFAKEtokenNotReal 123456789 > "$d/fake.txt"
          rc=0; "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 "$d" || rc=$?
          if [ "$rc" -ne 1 ]; then echo "::error::自检失败：gitleaks 没有报出运行时生成的假令牌（退出码 $rc），规则可能被放空了"; exit 1; fi
          echo "自检通过：假令牌被报出"
      # --log-opts=HEAD：默认是 --all，会把 checkout 取回的所有远程分支也扫进来，
      # 一个无关分支上的发现就会让所有 PR 变红。
      # 合并提交本身的 diff（解决冲突时新加的内容）不扫：git log -p 默认不输出它。
      # 允许清单：.gitleaksignore（按指纹逐条列出，每条写理由）和 .gitleaks.toml（按值放行的明显假值）
      - name: 扫描全部历史
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 --log-opts=HEAD .'
