# 类型检查、单元测试、构建网页、确定性 E2E、lint、格式化。见 docs/roadmap.md 的 CI 一项。
# job 名字（typecheck、unit-test、build-web、e2e-fake-model、lint、format）会设成必需检查，改名前先改分支保护。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 默认只读。这个工作流不使用任何仓库密钥。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # 和 #56 的 Dockerfile（node:24.22.3）保持一致，升级时两处一起改；package.json 要求 >=24.9.0
  NODE_VERSION: 24.22.3

jobs:
  # 纯文档 PR 跳过下面重的检查（判断见 .github/scripts/docs-only.ts）。脚本从 base（HEAD^1）取，PR 改它改变不了自己的结果。
  # 不是 pull_request、PR 不是指向默认分支（main）、base 上还没有这个脚本、或者这个 job 出错时，docs_only 都不是 true，下面照跑全套。
  # 只认指向 main 的 PR：不然先指向一个带了代码改动的分支（相对它只改文档）跳过检查，再把 base 改成 main，检查结果不会重跑。
  # 重的 job 跳过时，按原来的名字报告为 skipped（分支保护里算通过），不会卡在等待中。
  changes:
    name: changes-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: check
        if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        run: |
          if git show HEAD^1:.github/scripts/docs-only.ts > "$RUNNER_TEMP/docs-only.ts" 2>/dev/null; then
            node "$RUNNER_TEMP/docs-only.ts"
          else
            echo "base 上还没有 .github/scripts/docs-only.ts，跑全套"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # .github/scripts 下的检查脚本（不在根 tsconfig 的 include 里）
      - run: npx tsc -p .github/scripts

  unit-test:
    name: unit-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 含 tests/engine.state-space.test.ts 的穷举验证；不需要模型 key 和外网
      - run: npm test

  build-web:
    name: build-web
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:web

  # 确定性 E2E：用假模型（scripts/fake-model/）代替真实模型，跑一遍 scripts/e2e.ts 的全部核对项。不需要模型 key 和外网。这个 job 用默认执行器 dsh。
  # 覆盖平台、dsh、沙箱、git、检查命令；不覆盖模型本身的行为（提示词、技能、模板），那部分仍要真实模型的 E2E。
  e2e-fake-model:
    name: e2e-fake-model
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 记下这台机器上 dsh 实际用的沙箱（bwrap 或 Landlock），排查时用
      - name: 沙箱
        run: node --import tsx src/cli.ts doctor --data "$RUNNER_TEMP/eos-doctor" || true
      # 依赖装好后断开外网，只留本机：确定性 E2E 一个请求也不许发到真实的模型接口（或任何外部服务）
      - name: 断开外网
        run: |
          for t in iptables ip6tables; do
            sudo $t -A OUTPUT -o lo -j ACCEPT
            sudo $t -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
            sudo $t -A OUTPUT -j REJECT
          done
          if curl -sS --max-time 5 https://api.deepseek.com >/dev/null 2>&1; then echo '外网还通，没断开'; exit 1; fi
      - name: 确定性 E2E
        run: node --import tsx scripts/e2e-ci.ts
      # 恢复外网：后面上传 artifact、setup-node 保存缓存都要连 GitHub。E2E 失败也要恢复
      - name: 恢复外网
        if: always()
        run: |
          for t in iptables ip6tables; do
            sudo $t -D OUTPUT -j REJECT || true
            sudo $t -D OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || true
            sudo $t -D OUTPUT -o lo -j ACCEPT || true
          done
      - name: 保存报告和日志
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fake-model
          path: |
            .eos/e2e/report.json
            .eos/e2e/run.log
            .eos/e2e-ci/fake-model.log
          if-no-files-found: warn
          retention-days: 14

  # 同一个确定性 E2E，三个角色都用 Claude Code（scripts/e2e-ci.ts claude-code）：平台经 EOS_ANTHROPIC_BASE_URL 让 Claude Code 的上游连同一个假模型。
  # 跑的是真的 Claude Code，套着 Landlock；Landlock 用不了时执行器拒绝调用，这个 job 失败（不跳过）。
  e2e-fake-model-claude-code:
    name: e2e-fake-model-claude-code
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 记下这台机器上 Claude Code 的沙箱（Landlock）和安装情况，排查时用
      - name: 沙箱
        run: node --import tsx src/cli.ts doctor --data "$RUNNER_TEMP/eos-doctor" || true
      # 依赖装好后断开外网，只留本机：确定性 E2E 一个请求也不许发到真实的模型接口（或任何外部服务）
      - name: 断开外网
        run: |
          for t in iptables ip6tables; do
            sudo $t -A OUTPUT -o lo -j ACCEPT
            sudo $t -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
            sudo $t -A OUTPUT -j REJECT
          done
          if curl -sS --max-time 5 https://api.anthropic.com >/dev/null 2>&1; then echo '外网还通，没断开'; exit 1; fi
      - name: 确定性 E2E
        run: node --import tsx scripts/e2e-ci.ts claude-code
      # 恢复外网：后面上传 artifact、setup-node 保存缓存都要连 GitHub。E2E 失败也要恢复
      - name: 恢复外网
        if: always()
        run: |
          for t in iptables ip6tables; do
            sudo $t -D OUTPUT -j REJECT || true
            sudo $t -D OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || true
            sudo $t -D OUTPUT -o lo -j ACCEPT || true
          done
      - name: 保存报告和日志
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fake-model-claude-code
          path: |
            .eos/e2e/report.json
            .eos/e2e/run.log
            .eos/e2e-ci/fake-model.log
          if-no-files-found: warn
          retention-days: 14

  # lint 工具单独装在 .github/lint/：仓库编译用 TypeScript 7，没有 typescript-eslint 需要的 JS API，
  # 那里装 TS 6 只给 lint 用。规则见 .github/lint/eslint.config.mjs（架构规则、通用规则和逐条列出的例外）
  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/lint/package-lock.json
      - run: npm ci --prefix .github/lint --ignore-scripts
      - name: 规则和工具自己的测试
        run: node --test .github/lint/*.test.mjs
      - name: lint
        run: .github/lint/node_modules/.bin/eslint -c .github/lint/eslint.config.mjs --max-warnings 0 .

  # 格式化（Prettier）：检查全部代码文件，范围和忽略规则见 .github/lint/check-format.sh
  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/lint/package-lock.json
      - run: npm ci --prefix .github/lint --ignore-scripts
      - name: 检查格式
        run: bash .github/lint/check-format.sh
