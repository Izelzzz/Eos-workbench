# 依赖扫描：只看这个 PR 新引入或改动的依赖（对比 base 和 head 的锁文件），有已知漏洞时报出来。
# 运行时、开发和 scope 未知的依赖都算：高危及以上让检查变红。
# 中、低危不报也不拦：设了 fail-on-severity 后，action 在过滤阶段就把低于这个级别的漏洞丢掉，摘要里也看不到。
# 扫描范围：锁文件（根目录、.github/lint/、poc/claude-code/）、只有清单的 package.json（poc/，只能看到版本范围），
# 以及工作流里引用的 action。PoC 的依赖引入高危漏洞也会变红。
# 现有依赖里的漏洞（来自 dsh 的依赖树）不在这里拦，见 docs/roadmap.md 的 CI 一项。
# job 名字（dependency-review）会设成必需检查，改名前先改分支保护。
name: Dependency review

on:
  pull_request:

# 只读；不在 PR 上发评论（那需要 pull-requests: write），结果看 job 摘要。不使用任何仓库密钥。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # 和 ci.yml、image.yml、Dockerfile 的 Node 版本一致
  NODE_VERSION: 24.22.3

jobs:
  # 纯文档 PR 跳过下面重的检查（判断见 .github/scripts/docs-only.ts）。脚本从 base（HEAD^1）取，PR 改它改变不了自己的结果。
  # 不是 pull_request、PR 不是指向默认分支（main）、base 上还没有这个脚本、或者这个 job 出错时，docs_only 都不是 true，下面照跑全套。
  # 只认指向 main 的 PR：不然先指向一个带了代码改动的分支（相对它只改文档）跳过检查，再把 base 改成 main，检查结果不会重跑。
  # 重的 job 跳过时，按原来的名字报告为 skipped（分支保护里算通过），不会卡在等待中。
  changes:
    name: changes-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: check
        if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        run: |
          if git show HEAD^1:.github/scripts/docs-only.ts > "$RUNNER_TEMP/docs-only.ts" 2>/dev/null; then
            node "$RUNNER_TEMP/docs-only.ts"
          else
            echo "base 上还没有 .github/scripts/docs-only.ts，跑全套"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    name: dependency-review
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # 默认只算运行时依赖；lint 工具（.github/lint/）和 vite、tsx 等都是开发依赖，也要拦。
          # 明确标成 unknown 的改动默认被排除，也加上
          fail-on-scopes: runtime, development, unknown
